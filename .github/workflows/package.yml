name: Windows distribution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare verified toolchain
        run: ./scripts/bootstrap.ps1
      - name: Build and test
        run: ./scripts/build.ps1
      - name: Check formatting
        run: ./.tools/dotnet/dotnet.exe format WookText.slnx --verify-no-changes --no-restore
      - name: Build isolated test installer
        run: ./scripts/package.ps1 -SmokeInstaller
      - name: Verify installation and removal
        run: ./scripts/test-installer.ps1
      - name: Build distribution packages
        run: ./scripts/package.ps1
      - name: Verify checksums
        run: |
          foreach ($line in Get-Content artifacts/SHA256SUMS.txt) {
            $hash, $name = $line -split '  ', 2
            $path = if ($name.EndsWith('.exe')) { "artifacts/installer/$name" } else { "artifacts/$name" }
            if ((Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $hash) {
              throw "Checksum mismatch: $name"
            }
          }
      - name: Upload distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-distribution
          path: |
            artifacts/installer/*-setup.exe
            artifacts/*-portable.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload verification screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-verification
          path: artifacts/smoke/*.png
          if-no-files-found: warn
          retention-days: 30
